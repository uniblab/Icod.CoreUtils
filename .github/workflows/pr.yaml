name: build

on:
  pull_request:

jobs:
  repository-policy:
    name: repository policy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Verify UTF-8 text files
        shell: bash
        run: |
          python <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path

          checked_extensions = {
              ".csproj",
              ".sln",
              ".xml",
              ".cs",
              ".txt",
          }

          tracked_files = subprocess.check_output(
              ["git", "ls-files", "-z"]
          ).split(b"\0")

          errors: list[str] = []
          checked_count = 0

          for raw_path in tracked_files:
              if not raw_path:
                  continue

              path = Path(os.fsdecode(raw_path))

              if path.suffix.lower() not in checked_extensions:
                  continue

              checked_count += 1

              try:
                  contents = path.read_bytes()
                  contents.decode("utf-8-sig", errors="strict")
              except UnicodeDecodeError as exception:
                  errors.append(
                      f"{path}: invalid UTF-8 at byte "
                      f"{exception.start}: {exception.reason}"
                  )
              except OSError as exception:
                  errors.append(f"{path}: could not be read: {exception}")

          if errors:
              print("UTF-8 validation failed:", file=sys.stderr)

              for error in errors:
                  print(f"  {error}", file=sys.stderr)

              sys.exit(1)

          print(
              f"Validated {checked_count} tracked files as UTF-8."
          )
          PY

      - name: Verify project naming and configuration
        shell: bash
        run: |
          python <<'PY'
          import os
          import re
          import subprocess
          import sys
          import xml.etree.ElementTree as ElementTree
          from pathlib import Path

          project_name_pattern = re.compile(
              r"^Icod\.CoreUtils\.([A-Z][A-Za-z0-9]*)\.csproj$"
          )

          configuration_pattern = re.compile(
              r"^\s*'\$\(Configuration\)'\s*==\s*"
              r"'(Debug|Staging|Release)'\s*$"
          )

          required_configurations = {
              "Debug": {
                  "ErrorReport": "prompt",
                  "WarningLevel": "2",
                  "DebugSymbols": "true",
                  "DebugType": "full",
                  "Optimize": "false",
                  "DefineConstants": "DEBUG;TRACE",
                  "SignAssembly": "false",
                  "TreatWarningsAsErrors": "false",
              },
              "Staging": {
                  "ErrorReport": "prompt",
                  "WarningLevel": "3",
                  "DebugSymbols": "true",
                  "DebugType": "full",
                  "Optimize": "false",
                  "DefineConstants": "TRACE",
                  "SignAssembly": "false",
                  "TreatWarningsAsErrors": "false",
              },
              "Release": {
                  "ErrorReport": "prompt",
                  "WarningLevel": "4",
                  "DebugType": "pdbonly",
                  "Optimize": "true",
                  "SignAssembly": "false",
                  "TreatWarningsAsErrors": "true",
                  "WarningsNotAsErrors": "CS1591",
              },
          }

          def get_text(
              parent: ElementTree.Element,
              element_name: str,
          ) -> str | None:
              element = parent.find(element_name)

              if element is None or element.text is None:
                  return None

              return element.text.strip()

          def get_first_project_value(
              property_groups: list[ElementTree.Element],
              element_name: str,
          ) -> str | None:
              for property_group in property_groups:
                  value = get_text(property_group, element_name)

                  if value is not None:
                      return value

              return None

          tracked_files = subprocess.check_output(
              ["git", "ls-files", "-z"]
          ).split(b"\0")

          projects = sorted(
              Path(os.fsdecode(raw_path))
              for raw_path in tracked_files
              if raw_path
              and os.fsdecode(raw_path).lower().endswith(".csproj")
          )

          errors: list[str] = []

          for project in projects:
              try:
                  root = ElementTree.parse(project).getroot()
              except ElementTree.ParseError as exception:
                  errors.append(
                      f"{project}: invalid project XML: {exception}"
                  )
                  continue

              property_groups = root.findall("PropertyGroup")

              if not property_groups:
                  errors.append(
                      f"{project}: no PropertyGroup was found"
                  )
                  continue

              first_property_group = property_groups[0]

              target_framework = get_text(
                  first_property_group,
                  "TargetFramework",
              )

              if target_framework != "net10.0":
                  errors.append(
                      f"{project}: first PropertyGroup must contain "
                      f"<TargetFramework>net10.0</TargetFramework>; "
                      f"found {target_framework!r}"
                  )

              language_version = get_text(
                  first_property_group,
                  "LangVersion",
              )

              if language_version != "13.0":
                  errors.append(
                      f"{project}: first PropertyGroup must contain "
                      f"<LangVersion>13.0</LangVersion>; "
                      f"found {language_version!r}"
                  )

              configuration_groups: dict[
                  str,
                  ElementTree.Element,
              ] = {}

              for property_group in property_groups:
                  condition = property_group.attrib.get(
                      "Condition",
                      "",
                  )

                  match = configuration_pattern.fullmatch(condition)

                  if match is None:
                      continue

                  configuration = match.group(1)

                  if configuration in configuration_groups:
                      errors.append(
                          f"{project}: duplicate {configuration} "
                          "PropertyGroup"
                      )
                      continue

                  configuration_groups[configuration] = property_group

              for configuration, required_values in (
                  required_configurations.items()
              ):
                  property_group = configuration_groups.get(
                      configuration
                  )

                  if property_group is None:
                      errors.append(
                          f"{project}: missing {configuration} "
                          "configuration PropertyGroup"
                      )
                      continue

                  for property_name, expected_value in (
                      required_values.items()
                  ):
                      actual_value = get_text(
                          property_group,
                          property_name,
                      )

                      if actual_value != expected_value:
                          errors.append(
                              f"{project}: {configuration} "
                              f"{property_name} must be "
                              f"{expected_value!r}; "
                              f"found {actual_value!r}"
                          )

              output_type = get_first_project_value(
                  property_groups,
                  "OutputType",
              )

              is_test_project = any(
                  part.lower() == "tests"
                  for part in project.parts
              )

              if output_type != "Exe" or is_test_project:
                  continue

              tool_directory = project.parent.name

              if tool_directory != tool_directory.lower():
                  errors.append(
                      f"{project}: command directory must be "
                      f"lowercase; found {tool_directory!r}"
                  )

              name_match = project_name_pattern.fullmatch(project.name)

              if name_match is None:
                  errors.append(
                      f"{project}: command project filename must use "
                      "Icod.CoreUtils.{Tool}.csproj with a PascalCase "
                      "tool name"
                  )
                  continue

              project_tool_name = name_match.group(1)

              if project_tool_name.lower() != tool_directory:
                  errors.append(
                      f"{project}: project tool name "
                      f"{project_tool_name!r} does not match command "
                      f"directory {tool_directory!r}"
                  )

              assembly_name = get_first_project_value(
                  property_groups,
                  "AssemblyName",
              )

              if assembly_name != tool_directory:
                  errors.append(
                      f"{project}: AssemblyName must be the lowercase "
                      f"command directory name {tool_directory!r}; "
                      f"found {assembly_name!r}"
                  )

              if (
                  assembly_name is not None
                  and assembly_name != assembly_name.lower()
              ):
                  errors.append(
                      f"{project}: command AssemblyName must be "
                      f"lowercase; found {assembly_name!r}"
                  )

              expected_namespace = (
                  f"Icod.CoreUtils.{project_tool_name}"
              )

              root_namespace = get_first_project_value(
                  property_groups,
                  "RootNamespace",
              )

              if root_namespace != expected_namespace:
                  errors.append(
                      f"{project}: RootNamespace must be "
                      f"{expected_namespace!r}; "
                      f"found {root_namespace!r}"
                  )

          if errors:
              print(
                  "Project policy validation failed:",
                  file=sys.stderr,
              )

              for error in errors:
                  print(f"  {error}", file=sys.stderr)

              sys.exit(1)

          print(
              f"Validated naming and configuration for "
              f"{len(projects)} projects."
          )
          PY

  build-and-test:
    name: build and test (${{ matrix.os }})
    needs: repository-policy

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet clean Icod.CoreUtils.sln -c Debug

      - run: dotnet restore Icod.CoreUtils.sln

      - run: >
          dotnet build Icod.CoreUtils.sln
          -c Debug
          --no-restore

      - run: >
          dotnet test Icod.CoreUtils.sln
          -c Debug
          --no-build
          --no-restore
          --logger trx
