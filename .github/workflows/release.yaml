name: release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x
  CONFIGURATION: Release
  RELEASE_DIRECTORY: artifacts/release
  PACKAGE_ARTIFACT: nuget-packages

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      solution_path: ${{ steps.repository.outputs.solution_path }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - id: repository
        shell: pwsh
        run: ./packaging/Get-RepositoryMetadata.ps1 -Configuration '${{ env.CONFIGURATION }}' -GitHubOutputPath $env:GITHUB_OUTPUT
      - name: Require solution
        shell: pwsh
        run: |
          if ('true' -ne '${{ steps.repository.outputs.has_solution }}') {
              throw 'A tagged release requires exactly one root .sln or .slnx file.'
          }
      - name: Require tagged commit on main
        shell: pwsh
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if (0 -ne $LASTEXITCODE) {
              throw "Release tag '$env:GITHUB_REF_NAME' does not point to a commit contained in main."
          }
      - id: version
        name: Validate tag and package version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(?<version>[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?)$') {
              throw "Release tag '$tag' is not a supported v<semver> tag."
          }
          $tagVersion = $Matches.version
          Import-Module ./packaging/CoreUtilsVersion.psm1 -Force
          $repositoryVersion = Get-CoreUtilsVersion
          if ($tagVersion -ne $repositoryVersion) {
              throw "Tag version '$tagVersion' does not match repository version '$repositoryVersion'."
          }
          "version=$tagVersion" >> $env:GITHUB_OUTPUT
          "prerelease=$($tagVersion.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

  native-assets:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-15
            rid: osx-arm64
    name: native ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Build stdbuf native asset
        shell: pwsh
        run: ./packaging/BuildStdBufNativeAsset.ps1 -Configuration '${{ env.CONFIGURATION }}' -RuntimeIdentifier '${{ matrix.rid }}'
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: artifacts/native/libicodstdbuf-${{ matrix.rid }}.*
          if-no-files-found: error
          retention-days: 7

  archives:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
          - os: ubuntu-24.04
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-15
            rid: osx-arm64
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Build release archive
        shell: pwsh
        run: ./packaging/BuildReleaseArchive.ps1 -Configuration '${{ env.CONFIGURATION }}' -RuntimeIdentifier '${{ matrix.rid }}' -Version '${{ needs.metadata.outputs.version }}'
      - uses: actions/upload-artifact@v4
        with:
          name: release-archive-${{ matrix.rid }}
          path: ${{ env.RELEASE_DIRECTORY }}/Icod.CoreUtils-${{ needs.metadata.outputs.version }}-${{ matrix.rid }}.zip
          if-no-files-found: error
          retention-days: 7

  package:
    needs: [metadata, native-assets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: artifacts/native
          merge-multiple: true
      - name: Pack coreutils
        run: >-
          dotnet pack coreutils/Icod.CoreUtils.Router.csproj
          -c ${{ env.CONFIGURATION }}
          -o ${{ env.RELEASE_DIRECTORY }}
          -p:ContinuousIntegrationBuild=true
          -p:StdBufPackNativeAssetDirectory=${{ github.workspace }}/artifacts/native
      - name: Verify exact release package
        shell: pwsh
        run: ./packaging/VerifyLocalPackage.ps1 -ArtifactDirectory '${{ env.RELEASE_DIRECTORY }}'
      - name: Require multi-platform stdbuf assets
        shell: pwsh
        run: |
          $path = '${{ env.RELEASE_DIRECTORY }}/Icod.CoreUtils.${{ needs.metadata.outputs.version }}.nupkg'
          [xml]$project = Get-Content -LiteralPath 'coreutils/Icod.CoreUtils.Router.csproj' -Raw
          $targetFramework = @(
              $project.Project.PropertyGroup.TargetFramework |
                  Where-Object { -not [string]::IsNullOrWhiteSpace("$_") }
          )[0]
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($path)
          try {
              foreach ($assetName in @(
                  'libicodstdbuf-linux-x64.so',
                  'libicodstdbuf-linux-arm64.so',
                  'libicodstdbuf-osx-x64.dylib',
                  'libicodstdbuf-osx-arm64.dylib'
              )) {
                  $entryPath = "tools/$targetFramework/any/$assetName"
                  $entry = $archive.Entries | Where-Object { $_.FullName -eq $entryPath } | Select-Object -First 1
                  if ($null -eq $entry) {
                      throw "Package '$path' does not contain '$entryPath'."
                  }
              }
          } finally {
              $archive.Dispose()
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_ARTIFACT }}
          path: ${{ env.RELEASE_DIRECTORY }}/Icod.CoreUtils.${{ needs.metadata.outputs.version }}.nupkg
          if-no-files-found: error
          retention-days: 7

  publish-nuget:
    needs: [metadata, package]
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.PACKAGE_ARTIFACT }}
          path: artifacts/package
      - id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish to NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          $package = 'artifacts/package/Icod.CoreUtils.${{ needs.metadata.outputs.version }}.nupkg'
          dotnet nuget push $package --api-key $env:NUGET_API_KEY --source 'https://api.nuget.org/v3/index.json' --skip-duplicate
          if (0 -ne $LASTEXITCODE) { throw "NuGet.org publication failed with status $LASTEXITCODE." }

  publish-github-packages:
    needs: [metadata, package]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.PACKAGE_ARTIFACT }}
          path: artifacts/package
      - name: Publish to GitHub Packages
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
        run: |
          $source = "https://nuget.pkg.github.com/$env:GITHUB_OWNER/index.json"
          $package = 'artifacts/package/Icod.CoreUtils.${{ needs.metadata.outputs.version }}.nupkg'
          dotnet nuget push $package --source $source --api-key $env:GITHUB_TOKEN --skip-duplicate
          if (0 -ne $LASTEXITCODE) { throw "GitHub Packages publication failed with status $LASTEXITCODE." }

  github-release:
    needs: [metadata, archives, package, publish-nuget, publish-github-packages]
    if: >-
      always() &&
      needs.metadata.result == 'success' &&
      needs.archives.result == 'success' &&
      needs.package.result == 'success' &&
      needs.publish-nuget.result == 'success' &&
      needs.publish-github-packages.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.PACKAGE_ARTIFACT }}
          path: artifacts/release-assets
      - uses: actions/download-artifact@v4
        with:
          pattern: release-archive-*
          path: artifacts/release-assets
          merge-multiple: true
      - name: Create checksums
        shell: pwsh
        run: |
          $assetDirectory = 'artifacts/release-assets'
          $files = @(Get-ChildItem -LiteralPath $assetDirectory -File | Where-Object { $_.Extension -in @('.zip', '.nupkg') } | Sort-Object Name)
          if (7 -ne $files.Count) { throw "Expected seven release binaries before checksumming; found $($files.Count)." }
          $lines = foreach ($file in $files) {
              $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($file.Name)"
          }
          [System.IO.File]::WriteAllLines((Join-Path $assetDirectory 'SHA256SUMS.txt'), $lines, [System.Text.UTF8Encoding]::new($false))
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = '${{ needs.metadata.outputs.version }}'
          $assetDirectory = [System.IO.Path]::GetFullPath('artifacts/release-assets')
          $notes = @'
          ## Installation

          Install the .NET tool from NuGet.org:

          ```text
          dotnet tool install --global Icod.CoreUtils --version {0}
          ```

          The installed command is `coreutils`; use `coreutils COMMAND [args...]`
          to route to any command in the Icod.CoreUtils suite.

          Traditional executable ZIPs are attached for Windows, Linux, and
          macOS on both x64 and ARM64. They contain all 105 standalone commands,
          the `coreutils` router, per-command README/license files, and require
          the .NET 10 runtime.
          '@ -f $version
          $assets = @(Get-ChildItem -LiteralPath $assetDirectory -File | Where-Object { $_.Extension -in @('.zip', '.nupkg', '.txt') } | Sort-Object Name | ForEach-Object { $_.FullName })
          if (8 -ne $assets.Count) { throw "Expected eight GitHub Release assets; found $($assets.Count)." }
          $arguments = @('release', 'create', $env:GITHUB_REF_NAME, '--verify-tag', '--title', "Icod.CoreUtils $version", '--generate-notes', '--notes', $notes)
          if ('true' -eq '${{ needs.metadata.outputs.prerelease }}') {
              $arguments += '--prerelease'
              $arguments += '--latest=false'
          }
          $arguments += $assets
          & gh @arguments
          if (0 -ne $LASTEXITCODE) { throw "GitHub Release creation failed with status $LASTEXITCODE." }
