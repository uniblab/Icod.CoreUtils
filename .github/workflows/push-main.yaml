name: build

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  # ----------------------------------------------------
  # STAGE 1: Cross-Platform Build & Test (All 3 OSs)
  # ----------------------------------------------------
  build-and-test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet clean Icod.CoreUtils.sln -c Release
      - run: dotnet restore Icod.CoreUtils.sln
      - run: dotnet build Icod.CoreUtils.sln -c Release --no-restore
      - run: dotnet test Icod.CoreUtils.sln -c Release --no-build --logger trx

  # ----------------------------------------------------
  # STAGE 2: Secure Windows Authenticode Signing
  # ----------------------------------------------------
  secure-sign:
    needs: build-and-test # Only runs if Stage 1 completely passes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Re-compile code on the signing machine to target the binaries
      - run: dotnet build Icod.CoreUtils.sln -c Release

      - name: Authenticate to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install .NET Sign CLI Locally
        run: |
          dotnet new tool-manifest
          dotnet tool install sign --prerelease

      # Clean, single-line invocation completely passing variables via native expressions
      - name: Sign All CoreUtils Binaries via Azure Key Vault
        run: dotnet tool run sign code azure-key-vault "bin/Release/net10.0/*.exe" "bin/Release/net10.0/*.dll" --azure-key-vault-url "${{ secrets.KEY_VAULT_URL }}" --azure-key-vault-certificate "${{ secrets.KEY_VAULT_CERT_NAME }}" --timestamp-url "http://timestamp.digicert.com"
