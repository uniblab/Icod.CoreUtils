name: build

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  # ----------------------------------------------------
  # STAGE 1: Single-Pass Build, Sign, and Test Matrix
  # ----------------------------------------------------
  build-and-test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          
      # 1. Clean and Build exactly once per OS target
      - run: dotnet clean Icod.CoreUtils.sln -c Release
      - run: dotnet restore Icod.CoreUtils.sln
      - run: dotnet build Icod.CoreUtils.sln -c Release --no-restore

      # 2. Azure Authentication (Only logs in on the Windows runner)
      - name: Authenticate to Azure via OIDC
        if: matrix.os == 'windows-latest'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 3. Setup local tool definitions inside workspace
      - name: Install .NET Sign CLI Locally
        if: matrix.os == 'windows-latest'
        run: |
          dotnet new tool-manifest
          dotnet tool install sign --prerelease

      # 4. Standard Practice: Zero argument-flags. Everything passes cleanly via system environment memory
      - name: Sign All CoreUtils Binaries via Azure Key Vault
        if: matrix.os == 'windows-latest'
        run: dotnet tool run sign code azure-key-vault "bin/Release/net10.0/*.exe" "bin/Release/net10.0/*.dll"
        env:
          SIGN_AZURE_KEY_VAULT_URL: ${{ secrets.KEY_VAULT_URL }}
          SIGN_AZURE_KEY_VAULT_CERTIFICATE: ${{ secrets.KEY_VAULT_CERT_NAME }}
          SIGN_AZURE_KEY_VAULT_KEY: IcodStrongNameKey
          SIGN_KEY_CRYPTOGRAPHIC_ID: base64
          SIGN_TIMESTAMP_URL: http://timestamp.digicert.com

      # 5. Final validation execution: tests the signed binaries across all platforms
      - run: dotnet test Icod.CoreUtils.sln -c Release --no-build --logger trx
