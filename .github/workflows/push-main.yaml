name: push-main

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet clean Icod.DiffUtils.sln -c Release
      - run: dotnet restore Icod.DiffUtils.sln
      - run: dotnet build Icod.DiffUtils.sln -c Release --no-restore -p:ContinuousIntegrationBuild=true
      - run: dotnet test Icod.DiffUtils.sln -c Release --no-build --logger trx
