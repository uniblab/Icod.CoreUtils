name: push-main

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  # ----------------------------------------------------
  # STAGE 1: Cross-Platform Build & Test (All 3 OSs)
  # ----------------------------------------------------
  build-and-test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Clean
        run: dotnet clean Icod.CoreUtils.sln -c Release

      - name: Restore
        run: dotnet restore Icod.CoreUtils.sln

      - name: Build
        run: dotnet build Icod.CoreUtils.sln -c Release --no-restore

      # ------------------------------------------------
      # Windows-only Authenticode signing
      # ------------------------------------------------
      - name: Install AzureSignTool
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $toolDirectory = Join-Path `
              $env:RUNNER_TEMP `
              'AzureSignTool'

          dotnet tool install `
              --tool-path $toolDirectory `
              --version 7.0.1 `
              AzureSignTool

      - name: Authenticate to Azure
        if: matrix.os == 'windows-latest'
        uses: azure/login@v3
        env:
          AZURE_CORE_OUTPUT: none
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticode-sign Windows binaries
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          KEY_VAULT_URL: ${{ secrets.KEY_VAULT_URL }}
          KEY_VAULT_CERT_NAME: ${{ secrets.KEY_VAULT_CERT_NAME }}
        run: |
          $ErrorActionPreference = 'Stop'

          $signTool = Join-Path `
              $env:RUNNER_TEMP `
              'AzureSignTool\AzureSignTool.exe'

          if (-not (Test-Path -LiteralPath $signTool -PathType Leaf)) {
              throw "AzureSignTool was not found at '$signTool'."
          }

          $outputPattern = Join-Path `
              $env:GITHUB_WORKSPACE `
              '*\bin\Release\net10.0\*'

          $filesToSign = @(
              Get-ChildItem `
                  -Path $outputPattern `
                  -File |
              Where-Object {
                  $_.Extension -in @('.exe', '.dll')
              } |
              Sort-Object FullName -Unique
          )

          if ($filesToSign.Count -eq 0) {
              throw "No EXE or DLL files were found under '$outputPattern'."
          }

          Write-Host "Found $($filesToSign.Count) files to sign:"

          foreach ($file in $filesToSign) {
              Write-Host "  $($file.FullName)"
          }

          $fileList = Join-Path `
              $env:RUNNER_TEMP `
              'authenticode-files.txt'

          $filesToSign.FullName |
              Set-Content `
                  -LiteralPath $fileList `
                  -Encoding utf8NoBOM

          & $signTool sign `
              --azure-key-vault-url $env:KEY_VAULT_URL `
              --azure-key-vault-certificate $env:KEY_VAULT_CERT_NAME `
              --azure-key-vault-managed-identity `
              --file-digest sha256 `
              --timestamp-rfc3161 'http://timestamp.digicert.com' `
              --timestamp-digest sha256 `
              --verbose `
              --input-file-list $fileList

          if ($LASTEXITCODE -ne 0) {
              throw "AzureSignTool failed with exit code $LASTEXITCODE."
          }

          foreach ($file in $filesToSign) {
              $signature = Get-AuthenticodeSignature `
                  -FilePath $file.FullName

              $subject = if ($null -eq $signature.SignerCertificate) {
                  '<none>'
              } else {
                  $signature.SignerCertificate.Subject
              }

              Write-Host (
                  "$($file.FullName)`n" +
                  "  Status: $($signature.Status)`n" +
                  "  Signer: $subject"
              )

              if ($signature.Status -ne 'Valid') {
                  throw (
                      "Authenticode validation failed for " +
                      "'$($file.FullName)': " +
                      "$($signature.Status) — " +
                      "$($signature.StatusMessage)"
                  )
              }
          }

      - name: Test
        run: >
          dotnet test
          Icod.CoreUtils.sln
          -c Release
          --no-build
          --logger trx
