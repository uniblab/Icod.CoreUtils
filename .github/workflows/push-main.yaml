name: build

on:
  push:
    branches:
      - main

# Required to let the windows runner exchange its GitHub token for an Azure OIDC token
permissions:
  id-token: write
  contents: read

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          
      - run: dotnet clean Icod.CoreUtils.sln -c Release
      
      - run: dotnet restore Icod.CoreUtils.sln
      
      - run: dotnet build Icod.CoreUtils.sln -c Release --no-restore
      
      - run: dotnet test Icod.CoreUtils.sln -c Release --no-build --logger trx

      # SECURE SIGNING STAGE (Only fires when the matrix is processing Windows)
      - name: Authenticate to Azure via OIDC
        if: matrix.os == 'windows-latest'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 1. FIXED: Create a local tool manifest and install sign inside the workspace
      - name: Install .NET Sign CLI Locally
        if: matrix.os == 'windows-latest'
        run: |
          dotnet new tool-manifest
          dotnet tool install sign --prerelease

      # 2. FIXED: Trim the trailing slash dynamically from the vault URL secret
      - name: Sign All CoreUtils Binaries via Azure Key Vault
        if: matrix.os == 'windows-latest'
        run: |
          $vaultUrl = "${{ secrets.KEY_VAULT_URL }}".TrimEnd('/')
          dotnet tool run sign code azure-key-vault "bin/Release/net10.0/*.exe" "bin/Release/net10.0/*.dll" --azure-key-vault-url "$vaultUrl" --azure-key-vault-certificate "${{ secrets.KEY_VAULT_CERT_NAME }}" --timestamp-url "http://timestamp.digicert.com"
