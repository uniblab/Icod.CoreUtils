name: build

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  # ----------------------------------------------------
  # STAGE 1: Single-Pass Build, Sign, and Test Matrix
  # ----------------------------------------------------
  build-and-test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          
      # Compile exactly once per target OS
      - run: dotnet clean Icod.CoreUtils.sln -c Release
      - run: dotnet restore Icod.CoreUtils.sln
      - run: dotnet build Icod.CoreUtils.sln -c Release --no-restore

      # ====================================================
      # INTERMEDIATE WINDOWS SIGNING LOOP
      # ====================================================
      - name: Authenticate to Azure via OIDC
        if: matrix.os == 'windows-latest'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install .NET Sign CLI Locally
        if: matrix.os == 'windows-latest'
        run: |
          dotnet new tool-manifest
          dotnet tool install sign --prerelease

      # FIXED: Evaluates the secret natively into the parameter flag block without wrapper string quotes
      - name: Sign All CoreUtils Binaries via Azure Key Vault
        if: matrix.os == 'windows-latest'
        run: |
          dotnet tool run sign code azure-key-vault "bin/Release/net10.0/*.exe" "bin/Release/net10.0/*.dll" --azure-key-vault-url ${{ secrets.KEY_VAULT_URL }} --azure-key-vault-certificate "${{ secrets.KEY_VAULT_CERT_NAME }}" --timestamp-url "http://digicert.com" --azure-key-vault-key "IcodStrongNameKey" --key-cryptographic-id "base64"

      # ====================================================
      # FINAL TEST EXECUTION (Runs against signed binaries on Windows)
      # ====================================================
      - run: dotnet test Icod.CoreUtils.sln -c Release --no-build --logger trx
